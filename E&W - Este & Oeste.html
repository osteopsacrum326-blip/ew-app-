<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b2a86">
<title>E&W - Este & Oeste</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--p:#5b2a86;--y:#ffc107;--bg:#f6f2fa;--card:#fff;--tx:#1d1428;--mu:#6b5d7a;--bd:#e3d9ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17101f;--card:#241a31;--tx:#f1eaf8;--mu:#b5a6c6;--bd:#3a2c4c}}
:root[data-theme="dark"]{--bg:#17101f;--card:#241a31;--tx:#f1eaf8;--mu:#b5a6c6;--bd:#3a2c4c}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--p);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--p);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:4px solid var(--y)}
header img{height:42px;background:#fff;border-radius:8px;padding:3px}
header b{color:var(--y);font-size:22px;line-height:1}
header small{display:block;font-size:12px;opacity:.9}
#st{margin-left:auto;font-size:12px;background:rgba(255,255,255,.15);padding:4px 9px;border-radius:99px}
main{padding:14px;max-width:640px;margin:auto}
section{display:none}section.on{display:block}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
h2{font-size:18px;margin:4px 0 10px;color:var(--p)}
@media (prefers-color-scheme:dark){h2{color:var(--y)}}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button.b{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--y);color:#3b1a5a;font:700 16px inherit;cursor:pointer}
button.s{padding:9px 12px;border:0;border-radius:9px;background:var(--p);color:#fff;font:inherit}
.r{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.m{color:var(--mu);font-size:13px}
.t{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--y);color:#3b1a5a;font-weight:600}
.e{display:flex;gap:8px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--p);padding-bottom:env(safe-area-inset-bottom,0px);border-top:3px solid var(--y);z-index:9}
nav button{flex:1;padding:11px 4px;background:none;border:0;color:#d9c9ea;font:600 12px inherit}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--y)}
#toast{position:fixed;left:14px;right:14px;bottom:96px;background:#222;color:#fff;padding:12px;border-radius:12px;display:none;z-index:20;text-align:center}
</style></head><body>
<header><img id="lg" alt="Logo E&W"><div><b>E&W</b><small>Este & Oeste · Nutrientes vegetales</small></div><span id="st">…</span></header>
<main>
<section id="s-orders" class="on">
 <div class="c"><h2>Nuevo pedido</h2>
  <label>Cliente</label><input id="oc" placeholder="Nombre del cliente">
  <label>Producto</label><select id="op"></select>
  <label>Cantidad</label><input id="oq" type="number" min="1" max="10000" value="1" inputmode="numeric">
  <button class="b" id="ob">Crear pedido</button></div>
 <h2>Pedidos</h2><div id="ol"><p class="m">Cargando…</p></div>
</section>
<section id="s-cat"><h2>Catálogo (USD por tonelada, referencia)</h2><div id="pl"></div>
 <p class="m">Precios orientativos puesto en Cuba, nov-2026. Confirmar con la cotización del proveedor.</p></section>
<section id="s-ack"><div class="c"><h2>Acuse de recibo</h2>
 <label>Empresa cubana</label><input id="ac">
 <label>Modelo de negocio</label><select id="am"><option>Empresa estatal</option><option>Mipyme privada</option><option>Cooperativa (CCS/CPA/UBPC)</option><option>Trabajador por cuenta propia</option><option>Otro</option></select>
 <label>Correo electrónico</label><input id="ae" type="email" inputmode="email">
 <label>Producto</label><select id="ap"></select>
 <label>Toneladas (mínimo 20)</label><input id="at" type="number" min="20" step="any" inputmode="decimal">
 <label>Representante legal</label><input id="ar">
 <button class="b" id="ab">Generar y descargar acuse (PDF)</button></div></section>
</main>
<div id="toast"></div>

function drawOrders(){
 const L=$('#ol');if(!orders.length){L.innerHTML='<p class="m">Sin pedidos.</p>';return}
 L.innerHTML=orders.map(o=>`<div class="c"><div class="r"><b>${esc(o.client)}</b><span title="${o.pend?'Guardado sin conexión, pendiente de envío':'Sincronizado'}">${o.pend?'⏳':'☁️✓'}</span></div><div class="m">${esc(o.product)} × ${esc(o.qty)} t · Total $${esc(o.total)}</div>${admin?`<select data-st="${o.id}">${STATES.map(s=>`<option${s===o.status?' selected':''}>${s}</option>`).join('')}</select>`:`<span class="t">${esc(o.status)}</span>`}</div>`).join('')}
$('#pl').onclick=e=>{
 if(e.target.id==='seed'){REF.forEach(r=>db.collection('products').add(r).catch(()=>toast('Sin permiso')));return}
 const id=e.target.dataset.save;if(!id)return;const v=parseFloat($('#pr-'+id).value);
 if(!(v>0))return toast('Precio no válido');db.doc('products/'+id).update({price:v}).then(()=>toast('Precio actualizado')).catch(()=>toast('Sin permiso'))};
$('#ol').onchange=e=>{const id=e.target.dataset.st;if(id)db.doc('orders/'+id).update({status:e.target.value}).catch(()=>toast('Sin permiso'))};
$('#ob').onclick=()=>{
 const c=$('#oc').value.trim(),n=$('#op').value,q=parseInt($('#oq').value,10),p=prods.find(x=>x.name===n);
 if(!c||!p||!(q>=1&&q<=10000))return toast('Completa cliente, producto y cantidad');
 db.collection('orders').add({client:c,product:n,qty:q,total:p.price*q,status:'Pendiente',by:uid,at:Date.now()}).catch(()=>toast('No se pudo guardar'));
 $('#oc').value='';toast(navigator.onLine?'Pedido creado':'Pedido guardado, se enviará al volver el internet')};
$('#ab').onclick=async()=>{
 const d={co:$('#ac').value.trim(),mo:$('#am').value,em:$('#ae').value.trim(),pr:$('#ap').value,t:parseFloat($('#at').value),rp:$('#ar').value.trim()};
 if(!d.co||!d.rp||!/^\S+@\S+\.\S+$/.test(d.em))return toast('Completa todos los campos con un correo válido');
 if(!(d.t>=20))return toast('El mínimo es 20 toneladas');
 const n=new Date(),z=x=>String(x).padStart(2,'0'),date=`${z(n.getDate())}/${z(n.getMonth()+1)}/${n.getFullYear()}`,folio=`EW-${n.getFullYear()}${z(n.getMonth()+1)}${z(n.getDate())}-${z(n.getHours())}${z(n.getMinutes())}`;
 db.collection('acuses').add({folio,company:d.co,model:d.mo,email:d.em,product:d.pr,tons:d.t,rep:d.rp,by:uid,at:Date.now()}).catch(()=>{});
 const P=new jspdf.jsPDF({unit:'pt',format:'a4'});
 P.setFillColor(91,42,134);P.rect(0,0,595,112,'F');P.setFillColor(255,255,255);P.roundedRect(30,20,104,72,6,6,'F');P.addImage(LOGO,'JPEG',36,24,92,64);
 P.setFont('helvetica','bold');P.setFontSize(32);P.setTextColor(255,193,7);P.text('E&W',152,62);
 P.setFont('helvetica','normal');P.setFontSize(12);P.setTextColor(255,255,255);P.text('Este & Oeste - Nutrientes vegetales',152,84);
 P.setFillColor(255,193,7);P.rect(0,112,595,6,'F');
 P.setFont('helvetica','bold');P.setFontSize(17);P.setTextColor(91,42,134);P.text('ACUSE DE RECIBO DE INFORMACION',40,162);
 P.setFont('helvetica','normal');P.setFontSize(11);P.setTextColor(90,90,90);P.text('Folio: '+folio,40,180);
 const rows=[['Fecha',date],['Empresa cubana',d.co],['Modelo de negocio',d.mo],['Correo electronico',d.em],['Producto',d.pr],['Cantidad solicitada',d.t+' toneladas (minimo 20 t)'],['Representante legal',d.rp]];
 let y=215;rows.forEach(([k,v])=>{P.setFont('helvetica','bold');P.setTextColor(91,42,134);P.text(k,40,y);P.setFont('helvetica','normal');P.setTextColor(30,30,30);P.text(P.splitTextToSize(String(v),330),210,y);P.setDrawColor(220,210,235);P.line(40,y+10,555,y+10);y+=32});
 P.setFontSize(9.5);P.setTextColor(90,90,90);P.text(P.splitTextToSize('E&W acusa recibo de la informacion anterior, que sera utilizada unicamente para ofrecer un servicio personalizado. Este acuse no constituye un contrato ni una oferta en firme.',515),40,y+14);
 P.setDrawColor(91,42,134);P.line(70,y+110,260,y+110);P.line(335,y+110,525,y+110);P.setFontSize(10);P.text('Representante legal',110,y+124);P.text('Recibido por E&W',380,y+124);
 P.setFillColor(255,193,7);P.rect(0,805,595,4,'F');P.setFontSize(9);P.text('MxCu Ventures S.A. - Quintana Roo, Mexico',40,824);
 try{await dl.save({filename:`acuse_${folio}.pdf`,data:P.output('blob')});toast('Acuse listo')}catch(e){toast('Descarga cancelada o no disponible')}};
(async()=>{
 if(!window.claude){$('#ol').innerHTML='<p class="m">Abre E&W desde claude.ai.</p>';return}
 db=await claude.use('db');dl=await claude.use('downloads');const u=await claude.use('user');
 if(!db){$('#ol').innerHTML='<p class="m">Inicia sesión en claude.ai para usar E&W.</p>';return}
 if(u){admin=await u.canEdit();uid=await u.id()}
 db.collection('products').onSnapshot(s=>{prods=s.docs.map(d=>({id:d.id,...d.data()}));drawProds()});
 db.collection('orders').onSnapshot(s=>{orders=s.docs.map(d=>({id:d.id,pend:d.metadata.hasPendingWrites,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));drawOrders()});
 fillSel();
})();
</script></body></html>
